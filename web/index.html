<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stokwarung">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>stokwarung</title>
  <link rel="manifest" href="manifest.json">

  <!-- Midtrans Snap.js Sandbox -->
  <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-CyW1GyJqKIUCur1n"></script>
  <script>
    // Helper function dipanggil dari Dart untuk membuat Snap Token via fetch
    // menggunakan CORS proxy karena browser tidak bisa langsung hit Midtrans server API
    function openMidtransSnap(token, onSuccess, onPending, onError, onClose) {
      window.snap.pay(token, {
        onSuccess: function(result) { onSuccess(JSON.stringify(result)); },
        onPending: function(result) { onPending(JSON.stringify(result)); },
        onError: function(result) { onError(JSON.stringify(result)); },
        onClose: function() { onClose(); }
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
